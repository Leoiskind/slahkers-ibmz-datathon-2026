# Single source of truth for scope. Never hard-code stations in notebooks.
# CRS codes marked VERIFY must be checked against NaPTAN before bulk HSP pulls.
region: "Greater Manchester (10 boroughs)"

hubs:            # destination stations for inbound journeys
  - {crs: MAN, name: Manchester Piccadilly}
  - {crs: MCO, name: Manchester Oxford Road}
  - {crs: MCV, name: Manchester Victoria}
  - {crs: DGT, name: Deansgate}   # VERIFY

deprivation_lads: [Bolton, Bury, Manchester, Oldham, Rochdale, Salford, Stockport, Tameside, Trafford, Wigan]

origins:         # postcodes must fall in deprivation_lads (Wilmslow is Cheshire East: add it to the list if used)
  - {crs: LVM, name: Levenshulme}      # VERIFY
  - {crs: BUA, name: Burnage}          # VERIFY
  - {crs: EDY, name: East Didsbury}    # VERIFY
  - {crs: GTO, name: Gorton}           # VERIFY
  - {crs: FRF, name: Fairfield}        # VERIFY
  - {crs: MSO, name: Moston}           # VERIFY
  - {crs: MIA, name: Manchester Airport}  # VERIFY

dates:
  from: "2026-04-17"
  to: "2026-10-16"
  days: WEEKDAY

peaks:           # HHMM strings, as HSP expects
  morning_inbound: {from_time: "0700", to_time: "0930"}
  evening_outbound: {from_time: "1630", to_time: "1900"}

train_source: hsp   # hsp or maven (maven = MOCK data, pipeline testing only)

late_threshold_min: 5

paths:
  deprivation_source: data/raw/Deprivation_data.zip   # national IMD file (committed raw input)
  stations_csv: data/raw/uk/uk_stations.csv           # station_code, station_name, latitude, longitude
  gm_stations_csv: data/raw/manchester_old/manchester_stations_with_coords.csv
  naptan_csv: data/raw/uk/naptan_uk_stations.csv
  lsoa_centroids: data/raw/uk/lsoa_centroids_2011.csv  # 2011 LSOAs: swap for the 2021 PWC file
  deprivation_lookup: data/processed/gm_deprivation.csv  # built by src.prep_deprivation
  data_dir: data

rtt:             # Realtime Trains API (src/rtt.py). Spec: https://realtimetrains.github.io/api-specification/
  base_url: "https://data.rtt.io"
  min_interval_s: 6.1        # our account: 10/minute, 100/hour, 1000/day

hub_peaks:       # HH:MM UK local; window applies to the scheduled time AT THE HUB (src.rtt, src.timetable)
  morning: {from: "07:00", to: "09:59", at_hub: arrival}     # trains from origin arriving at hub
  evening: {from: "16:00", to: "18:59", at_hub: departure}   # trains from hub departing towards origin

timetable:       # Network Rail SCHEDULE full extract (JSON), src.timetable
  extract: data/raw/timetable/toc-full.gz
  gm_stations_csv: data/raw/manchester_old/manchester_stations_with_coords.csv   # every GM station = origin
